observations:
  - id: O001
    source: endpoint_monitoring
    statement: Ransomware encryption activity was detected on multiple file servers.
    reliability: confirmed

  - id: O002
    source: identity_monitoring
    statement: Multiple failed authentications were followed by a successful login for svc_backup.
    reliability: high

  - id: O003
    source: identity_monitoring
    statement: svc_backup authenticated from a source not seen in its recent sign-in history.
    reliability: high

  - id: O004
    source: network_monitoring
    statement: FILESERVER-03 generated approximately 18 GB of outbound traffic during a nine-minute period.
    reliability: high

  - id: O005
    source: asset_inventory
    statement: FILESERVER-03 contains directories used for customer-data exports.
    reliability: confirmed

findings:
  - id: FD001
    statement: The svc_backup login originated from an unmanaged internet address rather than the internal backup server.
    reliability: high

  - id: FD002
    statement: During the previous 90 days, svc_backup authenticated only from the internal backup server.
    reliability: high

  - id: FD003
    statement: Shortly after login, svc_backup enumerated shared directories on FILESERVER-03.
    reliability: high

  - id: FD004
    statement: The outbound destination is not associated with any approved organizational service.
    reliability: high

  - id: FD005
    statement: Customer-export directories were accessed by svc_backup shortly before the outbound transfer.
    reliability: high

  - id: FD006
    statement: No approved backup job was scheduled for FILESERVER-03 during the transfer window.
    reliability: high

  - id: FD008
    statement: A compressed archive containing customer records was created shortly before the outbound transfer.
    reliability: high

  - id: FD009
    statement: Network-flow byte counts closely match the size of the customer-record archive.
    reliability: high

  - id: FD010
    statement: The outbound destination belongs to the organizations approved backup provider.
    reliability: high

  - id: FD011
    statement: Files read before the transfer match the selection in the scheduled backup manifest.
    reliability: high

  - id: FD012
    statement: The transfer correlates with an approved backup job identifier and expected execution window.
    reliability: confirmed

  - id: FD013
    statement: Forensic review found no host or network artifact showing a transfer outside the approved backup channel.
    reliability: high
