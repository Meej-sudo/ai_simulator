services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trainer
      POSTGRES_USER: trainer
      POSTGRES_PASSWORD: trainer
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainer -d trainer"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - trainer_db:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://trainer:trainer@db:5432/trainer
      SCENARIOS_PATH: /app/scenarios
      LLM_SETTINGS_PATH: /app/llm-config/.env
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_DISCOVERY_TIMEOUT_SECONDS: ${OLLAMA_DISCOVERY_TIMEOUT_SECONDS:-10}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-300}
    volumes:
      - ./scenarios:/app/scenarios:rw
      - ./.llm-config:/app/llm-config:rw
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      INTERNAL_API_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  trainer_db:
